[project]
name = "babel-tv"
version = "0.1.0"
description = "Watch any public TV channel with live, fully local translated subtitles."
requires-python = ">=3.10"
dependencies = ["faster-whisper>=1.1", "numpy"]

[project.scripts]
babel-tv = "babel_tv.cli:main"

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["babel_tv"]
